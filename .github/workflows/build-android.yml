name: Build Daftar Sher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Daftar Sher APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect project structure
        run: |
          echo "=================================="
          echo "PROJECT FILES"
          echo "=================================="

          if [ -d android-app ]; then
            find android-app -maxdepth 10 -type f | sort
          else
            echo "ERROR: android-app directory is missing!"
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

      - name: Check required files
        run: |
          missing=0

          for file in \
            android-app/settings.gradle \
            android-app/build.gradle \
            android-app/app/build.gradle \
            android-app/app/src/main/AndroidManifest.xml \
            android-app/app/src/main/java/space/balehroon/daftarsher/MainActivity.kt \
            android-app/app/src/main/res/values/strings.xml
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "ERROR: Required files are missing."
            echo "Check the project structure shown above."
            exit 1
          fi

          echo "All required files exist."

      - name: Build debug APK
        working-directory: android-app
        run: |
          gradle --version
          gradle --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      - name: Verify APK
        if: success()
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK" ]; then
            echo "APK successfully created!"
            ls -lh "$APK"
          else
            echo "ERROR: APK was not generated."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daftar-sher-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14